<ui:composition xmlns="http://www.w3.org/1999/xhtml"
                xmlns:p="http://primefaces.org/ui"
                xmlns:h="jakarta.faces.html"
                xmlns:ui="jakarta.faces.facelets"
                template="#{layoutView.template}">


  <ui:define name="body">
    <div class="row">
      <div class="ui-sm-12">

        <div class="error-page">
          <h2 class="headline text-danger">#{admMessages['error_403_header']}</h2>

          <div class="error-content" style="font-size: 1.1em">
            <h3><i class="pi pi-lock text-danger"/> #{admMessages['error_403_message']}</h3>

            <h:form id="linkForm">
              <p>
                <h:outputText value="#{admMessages['label_go_back']}&#160;"/>
                <p:link outcome="#{pfAdmConfig.indexPage}" value="#{admMessages['label_home']}" escape="false"/>

                <h:outputText value="&#160;#{admMessages['label_or_to']}&#160;"/>
                <p:commandLink onclick="window.history.back();" value="#{admMessages['label_previous_page']}"
                               escape="false"/>
              </p>
            </h:form>


          </div>
        </div>
      </div>
    </div>
  </ui:define>


</ui:composition>
